spring.application.name=aquat-api

# Servidor
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aquat}?serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:aquatadmin}
spring.datasource.password=${DB_PASS:}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Seguridad JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Datos iniciales
app.seed.enabled=${SEED_ENABLED:false}
app.seed.password=${SEED_PASSWORD:}